services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: irenexa-app
    working_dir: /var/www
    command: >
      sh -c "mkdir -p /var/www/storage/framework/views /var/www/bootstrap/cache /var/www/database \
      && chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache /var/www/database \
      && chmod -R 0777 /var/www/storage /var/www/bootstrap/cache /var/www/database \
      && [ -f /var/www/database/database.sqlite ] || touch /var/www/database/database.sqlite \
      && chown www-data:www-data /var/www/database/database.sqlite \
      && php-fpm"
    volumes:
      - ./src:/var/www
    depends_on:
      - mysql
      - redis
    networks:
      - irenexa

  # Long-running queue worker supervisor (Laravel Horizon). Same image and
  # code as `app`, but runs `php artisan horizon` instead of php-fpm — it
  # is the process that actually picks jobs off the Redis queue.
  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: irenexa-horizon
    working_dir: /var/www
    command: php artisan horizon
    volumes:
      - ./src:/var/www
    depends_on:
      - mysql
      - redis
    networks:
      - irenexa

  nginx:
    image: nginx:1.27-alpine
    container_name: irenexa-nginx
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - irenexa

  mysql:
    image: mysql:8.4
    container_name: irenexa-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: irenexa
      MYSQL_USER: irenexa
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - irenexa

  # Document database for the append-only event/audit stream (Phase 15).
  # Local development credentials only, same spirit as the MySQL service.
  mongodb:
    image: mongo:7
    container_name: irenexa-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: irenexa
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - irenexa

  # Browser UI for MongoDB, the counterpart of Adminer for MySQL. Local
  # development only: it is published on 127.0.0.1 (this machine, not the
  # network) and protected by a basic-auth login.
  mongo-express:
    image: mongo-express:1
    container_name: irenexa-mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://irenexa:password@mongodb:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: irenexa
      ME_CONFIG_BASICAUTH_PASSWORD: password
    ports:
      - "127.0.0.1:8082:8081"
    depends_on:
      - mongodb
    networks:
      - irenexa

  # Search engine (Lesson 16.4). Published on 127.0.0.1 only. The master key
  # is a LOCAL-DEVELOPMENT value; production uses a long random secret.
  # Dashboard: http://localhost:7700 (enter the master key).
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: irenexa-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: local-dev-master-key-change-me
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meili_data:/meili_data
    networks:
      - irenexa

  redis:
    image: redis:7-alpine
    container_name: irenexa-redis
    ports:
      - "6379:6379"
    networks:
      - irenexa

  # Local "mail catcher" (Lesson 14.3): accepts SMTP on 1025 and shows
  # every email in a web inbox at http://localhost:8025. Nothing is ever
  # delivered to a real address, so development can't email real people.
  mailpit:
    image: axllent/mailpit:latest
    container_name: irenexa-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks:
      - irenexa

  adminer:
    image: adminer:latest
    container_name: irenexa-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - mysql
    networks:
      - irenexa

volumes:
  mysql_data:
  mongo_data:
  meili_data:

networks:
  irenexa: