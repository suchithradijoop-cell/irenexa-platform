; Custom PHP settings for the IRENEXA app container.
;
; memory_limit: the base php:8.3-fpm image has no php.ini of its own, so
; PHP falls back to its compiled-in default of 128M. That's fine for
; serving normal web requests, but static analysis tools like PHPStan
; load and analyse the entire codebase in memory at once (especially with
; parallel workers), which outgrows 128M as the project grows. 512M is a
; safe, generous ceiling for local development tooling without being
; "unlimited" (which would hide a genuine runaway-memory bug instead of
; surfacing it).
memory_limit = 512M
